[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eukaryoma-ppi"
version = "0.1.0"
description = "Streamlit viewer for pairwise protein-protein interactions extracted from pooled AlphaFold3 predictions"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
